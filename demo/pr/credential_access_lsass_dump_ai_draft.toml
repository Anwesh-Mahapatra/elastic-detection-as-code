[metadata]
creation_date = "2026/10/30"
maturity = "production"
updated_date = "2026/10/30"

[rule]
author = ["AI Assistant"]
description = "Detects credential dumping from LSASS using ProcDump by looking for the dump file being written to disk."
from = "now-5m"
index = ["logs-*"]
language = "eql"
license = "Elastic License v2"
name = "LSASS Credential Dumping via ProcDump"
risk_score = 21
rule_id = "lsass-dump-001"
severity = "critical"
tags = ["Credential Access", "LSASS", "ProcDump"]
type = "eql"

query = '''
sequence with maxspan=1d
  [process where process.name.keyword == "procdump.exe" and process.cmd : "*-ma*"]
  [file where file.name : "*lsass*.dmp" and not user.name : "admin*"]
'''

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1003"
name = "Credential Dumping"
reference = "https://attack.mitre.org/techniques/T1003/"

[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"
