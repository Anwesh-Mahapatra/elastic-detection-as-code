[metadata]
creation_date = "2026/10/30"
integration = ["endpoint", "windows"]
maturity = "production"
updated_date = "2026/10/30"

[rule]
author = ["Anwesh Mahapatra"]
description = """
Identifies LSASS memory dumping with Sysinternals ProcDump (including renamed copies) or with the
built-in comsvcs.dll MiniDump export run through rundll32 (by export name or by ordinal). Both are
among the most common ways to steal credentials from LSASS memory (Atomic Red Team T1003.001 tests 1 and 2).
"""
false_positives = [
    """
    Vendor or Microsoft support sessions that explicitly dump LSASS for troubleshooting. These are rare and
    should be handled with a scoped Kibana exception on the reviewed workflow (parent executable + signer +
    host group), never on process.name - ProcDump is legitimately Microsoft-signed, so attackers use the
    real signed binary.
    """,
]
from = "now-9m"
index = ["logs-endpoint.events.process-*", "logs-windows.sysmon_operational-*", "winlogbeat-*"]
language = "eql"
license = "Apache-2.0"
name = "LSASS Memory Dump via ProcDump or Comsvcs.dll"
note = """## Triage
- Confirm the target: `process.command_line` names lsass / KeyIso / SamSs, or comsvcs MiniDump / #24.
- Check the binary: `process.executable` outside `C:\\Program Files` or a name that differs from
  `process.pe.original_file_name` (renamed ProcDump) is a strong signal.
- Pivot on `host.id` + `process.entity_id` for the dump file (`file.path`) and anything that copies or
  uploads it. Assume every credential cached on the host is exposed if a dump was written.

## Known gaps (covered by companion rules, not this one)
- ProcDump targeting LSASS by PID, MiniDumpWriteDump from custom tools, and a renamed copy of
  comsvcs.dll called without the #24 ordinal: use LSASS process-access (handle) detections.
"""
references = [
    "https://learn.microsoft.com/en-us/sysinternals/downloads/procdump",
    "https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1003.001/T1003.001.md",
    "https://modexp.wordpress.com/2019/08/30/minidumpwritedump-via-com-services-dll/",
]
risk_score = 73
rule_id = "93697e37-f637-44ec-a7b2-9572ffa5e824"
severity = "high"
tags = [
    "Domain: Endpoint",
    "OS: Windows",
    "Use Case: Threat Detection",
    "Tactic: Credential Access",
    "Data Source: Elastic Defend",
    "Data Source: Sysmon",
    "Rule Type: Event Correlation (EQL)",
]
timestamp_override = "event.ingested"
type = "eql"

query = '''
process where host.os.type == "windows" and event.type == "start" and
(
  /* ProcDump, incl. renamed copies (the PE OriginalFileName survives a rename), writing a full,
     mini or MiniPlus dump of LSASS or of the LSASS-hosted KeyIso / SamSs services.
     Switches are listed with every dash prefix Windows tools accept (windash). */
  (
    (?process.pe.original_file_name : "procdump" or
     process.name : ("procdump.exe", "procdump64.exe", "procdump64a.exe")) and
    process.args : ("-ma", "/ma", "–ma", "—ma", "―ma",
                    "-mm", "/mm", "–mm", "—mm", "―mm",
                    "-mp", "/mp", "–mp", "—mp", "―mp") and
    process.command_line : ("*lsass*", "* keyiso*", "* samss*")
  ) or
  /* comsvcs.dll MiniDump export through rundll32 (incl. renamed rundll32), by export name or by
     ordinal: #24, #+24, negative (#-...) and 16-bit wrap-around (#65560) variants. */
  (
    (?process.pe.original_file_name : "RUNDLL32.EXE" or process.name : "rundll32.exe") and
    (
      (process.command_line : "*comsvcs*" and
       process.command_line : ("*MiniDump*", "*#24*", "*#+24*", "*#-*", "*#65560*")) or
      /* a renamed copy of comsvcs.dll still needs the ordinal and the "full" argument */
      process.command_line : "*#*24* full*"
    )
  )
)
'''

[rule.investigation_fields]
field_names = [
    "host.name",
    "user.name",
    "process.executable",
    "process.pe.original_file_name",
    "process.command_line",
    "process.parent.executable",
    "process.code_signature.subject_name",
]

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1003"
name = "OS Credential Dumping"
reference = "https://attack.mitre.org/techniques/T1003/"

[[rule.threat.technique.subtechnique]]
id = "T1003.001"
name = "LSASS Memory"
reference = "https://attack.mitre.org/techniques/T1003/001/"

